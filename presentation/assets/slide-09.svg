<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F6F3EC"/><text x="64" y="88" fill="#142939" font-family="Arial, sans-serif" font-size="48" font-weight="700" text-anchor="start">Une action ratée peut bloquer toute la quête</text><text x="64" y="684" fill="#60717C" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">TextWorld / Qwen 0.5B / LoRA</text><text x="1215" y="684" fill="#60717C" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="end">09</text><text x="65" y="165" fill="#60717C" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start">TRACE RÉELLE : LoRA simple, easy-30000</text><circle cx="93" cy="246" r="27" fill="#B84340" stroke="none" stroke-width="3"/><text x="93" y="255" fill="white" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">01</text><text x="65" y="328" fill="#142939" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start">Prise ratée</text><text x="65" y="379" fill="#B84340" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">take insect from floor</text><path d="M135,246 L430,246" fill="none" stroke="#9AA8AF" stroke-width="3" stroke-dasharray=""/><polyline points="419,239 430,246 419,253" fill="none" stroke="#9AA8AF" stroke-width="3"/><circle cx="500" cy="246" r="27" fill="#365CF5" stroke="none" stroke-width="3"/><text x="500" y="255" fill="white" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">02</text><text x="472" y="328" fill="#142939" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start">Départ sans l’objet</text><text x="472" y="379" fill="#365CF5" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">go south</text><path d="M542,246 L837,246" fill="none" stroke="#9AA8AF" stroke-width="3" stroke-dasharray=""/><polyline points="826,239 837,246 826,253" fill="none" stroke="#9AA8AF" stroke-width="3"/><circle cx="907" cy="246" r="27" fill="#B84340" stroke="none" stroke-width="3"/><text x="907" y="255" fill="white" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">03</text><text x="879" y="328" fill="#142939" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start">Dépôt impossible</text><text x="879" y="379" fill="#B84340" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">put insect on mantle</text><rect x="65" y="423" width="1150" height="69" rx="8" fill="#F2DED5" stroke="none" stroke-width="2"/><text x="92" y="467" fill="#B84340" font-family="Arial, sans-serif" font-size="27" font-weight="600" text-anchor="start">Le jeu avait répondu : “You can’t see any such thing.”</text><text x="65" y="568" fill="#142939" font-family="Arial, sans-serif" font-size="50" font-weight="700" text-anchor="start">30 coups</text><text x="450" y="568" fill="#B84340" font-family="Arial, sans-serif" font-size="43" font-weight="700" text-anchor="start">29 non admissibles</text><text x="65" y="625" fill="#142939" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Le modèle continue le plan et répète des commandes malgré l’échec initial.</text></svg>