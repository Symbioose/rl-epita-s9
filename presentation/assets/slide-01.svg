<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#142939"/><text x="64" y="88" fill="#F6F3EC" font-family="Arial, sans-serif" font-size="48" font-weight="700" text-anchor="start">APPRENDRE À JOUER PAR LE TEXTE</text><text x="64" y="684" fill="#ADC2CC" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">TextWorld / Qwen 0.5B / LoRA</text><text x="1215" y="684" fill="#ADC2CC" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="end">01</text><text x="64" y="196" fill="#F6F3EC" font-family="Arial, sans-serif" font-size="62" font-weight="700" text-anchor="start">Un petit modèle peut-il</text><text x="64" y="274" fill="#F6F3EC" font-family="Arial, sans-serif" font-size="62" font-weight="700" text-anchor="start">apprendre à jouer ?</text><text x="68" y="410" fill="#CAD8DB" font-family="Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start">Nous lui apprenons à suivre des quêtes textuelles.</text><text x="68" y="522" fill="#9DAFFC" font-family="Arial, sans-serif" font-size="56" font-weight="700" text-anchor="start">0,5 milliard</text><text x="72" y="564" fill="#CAD8DB" font-family="Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">de paramètres dans le modèle initial</text><rect x="835" y="174" width="364" height="394" rx="24" fill="#223C4D" stroke="none" stroke-width="2"/><text x="875" y="227" fill="#A8C3CE" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start">UNE VRAIE PARTIE</text><g transform="translate(935 274) scale(1.1)"><rect x="0" y="25" width="140" height="100" rx="6" fill="#D6AA76" stroke="#142939" stroke-width="3"/><rect x="0" y="0" width="140" height="46" rx="18" fill="#E5C49D" stroke="#142939" stroke-width="3"/><rect x="61" y="36" width="20" height="35" rx="3" fill="#E77343" stroke="#142939" stroke-width="2"/><path d="M12,88 L128,88" fill="none" stroke="#A