<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#142939"/><text x="64" y="88" fill="#F6F3EC" font-family="Arial, sans-serif" font-size="48" font-weight="700" text-anchor="start">Un petit modèle apprend, avec des limites</text><text x="64" y="684" fill="#ADC2CC" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">TextWorld / Qwen 0.5B / LoRA</text><text x="1215" y="684" fill="#ADC2CC" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="end">10</text><text x="65" y="199" fill="#BCD0D8" font-family="Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start">LoRA mixte sur les jeux non vus</text><text x="65" y="335" fill="#A9BAFF" font-family="Arial, sans-serif" font-size="112" font-weight="700" text-anchor="start">39/40</text><text x="445" y="335" fill="#FFB28D" font-family="Arial, sans-serif" font-size="112" font-weight="700" text-anchor="start">31/40</text><text x="72" y="388" fill="#F6F3EC" font-family="Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start">jeux simples</text><text x="452" y="388" fill="#F6F3EC" font-family="Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start">jeux avancés</text><path d="M65,435 L1200,435" fill="none" stroke="#4E6472" stroke-width="2" stroke-dasharray=""/><text x="65" y="493" fill="#F6F3EC" font-family="Arial, sans-serif" font-size="32" font-weight="600" text-anchor="start">L’imitation fonctionne sur ce benchmark.</text><text x="65" y="540" fill="#F6F3EC" font-family="Arial, sans-serif" font-size="32" font-weight="600" text-anchor="start">Les démonstrations mixtes améliorent notre agent.</text><text x="65" y="602" fill="#BCD0D8" font-family="Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">Une graine, objectifs explicites et davantage de données pour le mixte.</text><text x="65" y="636" fill="#BCD0D8" font-family="Arial, sans-