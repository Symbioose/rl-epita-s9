<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F6F3EC"/><text x="64" y="88" fill="#142939" font-family="Arial, sans-serif" font-size="48" font-weight="700" text-anchor="start">Annexe : réglages de l’expérience</text><text x="64" y="684" fill="#60717C" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">TextWorld / Qwen 0.5B / LoRA</text><text x="1215" y="684" fill="#60717C" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="end">01</text><text x="65" y="178" fill="#142939" font-family="Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start">Qwen2.5-0.5B-Instruct · LoRA q_proj/v_proj</text><text x="65" y="241" fill="#142939" font-family="Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start">r = 16 · α = 32 · dropout = 0,05</text><text x="65" y="304" fill="#142939" font-family="Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start">Learning rate = 2e−4 · batch 2 × accumulation 8</text><text x="65" y="367" fill="#142939" font-family="Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start">3 époques configurées · graine 42</text><text x="65" y="430" fill="#142939" font-family="Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start">Contexte 1024 tokens · greedy · 32 nouveaux tokens max</text><text x="65" y="565" fill="#365CF5" font-family="Arial, sans-serif" font-size="25" font-weight="600" text-anchor="start">Simple : 355 exemples / 66 mises à jour. Mixte : 1179 / 219.</text><text x="65" y="618" fill="#142939" font-family="Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">Checkpoint : minimum de loss de validation. Pas de sélection sur test.</text></svg>